<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Automation API</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h1>📊 Report Automation API</h1>
<p class="subtitle">Upload a file and generate aggregated reports.</p>

<section id="upload-section">
    <h2>1. Upload File</h2>
    <div class="file-upload-wrapper">
        <label for="fileInput" class="file-label">Choose File</label>
        <input type="file" id="fileInput">
        <span id="fileChosen">No file chosen</span>
        <button class="primary" id="uploadBtn">Upload</button>
    </div>
    <div id="uploadResult" class="result-box" style="display:none;"></div>
</section>

<section id="report-section">
    <h2>2. Generate Report</h2>
    <div class="flex-row">
        <label>Group by: <input type="text" id="groupBy" value=' "Beds"'></label>
        <label>Aggregate: <input type="text" id="aggCol" value=' "Taxes"'></label>
        <label>Metrics: <input type="text" id="aggList" value="sum,mean,count"></label>
        <label><input type="checkbox" id="detectOutliers"> Detect outliers</label>
    </div>
    <div class="btn-group">
        <button class="primary" id="reportBtn">Generate Summary</button>
        <button class="secondary" id="downloadCsvBtn">Download CSV</button>
        <button class="secondary" id="downloadExcelBtn">Download Excel</button>
    </div>
    <div id="reportResult" class="result-box" style="display:none;"></div>
</section>

<script src="/js/app.js"></script>
</body>
</html>
